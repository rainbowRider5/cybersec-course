    <meta charset="UTF-8" />

    <meta name="description" content="Groundwork: a self-study cybersecurity course with interactive lessons, a simulated Linux terminal, and quizzes." />

    <title>Groundwork · Cybersecurity Course</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('groundwork-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <noscript>This course needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
